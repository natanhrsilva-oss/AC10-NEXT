name: "10 - AC10 PRE"

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Data opcional YYYY-MM-DD"
        required: false
        type: string
  schedule:
    # Brasília (UTC-3): 06:00 principal; 06:30 e 07:00 são watchdogs.
    # TODOS usam --if-missing: depois de um PRE SUCCESS no dia, nenhuma execução automática roda de novo.
    - cron: "0 9 * * *"
    - cron: "30 9 * * *"
    - cron: "0 10 * * *"

permissions:
  contents: read

concurrency:
  group: ac10-pre
  cancel-in-progress: false

jobs:
  pre:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_PRE: ${{ secrets.DISCORD_WEBHOOK_PRE }}
      DISCORD_WEBHOOK_LIVE: ${{ secrets.DISCORD_WEBHOOK_LIVE }}
      GOOGLE_SHEETS_WEBAPP_URL: ${{ secrets.GOOGLE_SHEETS_WEBAPP_URL }}
      GOOGLE_SHEETS_TOKEN: ${{ secrets.GOOGLE_SHEETS_TOKEN }}
      APP_TIMEZONE: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run PRE
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.date }}" ]; then
              ac10-next pre --date "${{ inputs.date }}"
            else
              ac10-next pre
            fi
          else
            ac10-next pre --if-missing
          fi
