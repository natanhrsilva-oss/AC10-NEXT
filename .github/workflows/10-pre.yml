name: "10 - AC10 PRE"

run-name: "PRE | ${{ github.event_name }} | ${{ inputs.source || 'github-schedule' }}"

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Data opcional YYYY-MM-DD"
        required: false
        type: string
      source:
        description: "Origem do disparo (manual/supabase)"
        required: false
        default: "manual"
        type: string
  schedule:
    # BACKUP do relógio primário do Supabase.
    # Brasília (UTC-3): 03:15 e 03:30.
    # Ambos usam --if-missing: após um PRE SUCCESS no dia, não executam novamente.
    - cron: "15 6 * * *"
    - cron: "30 6 * * *"

permissions:
  contents: read

concurrency:
  group: ac10-pre
  cancel-in-progress: false

jobs:
  pre:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_PRE: ${{ secrets.DISCORD_WEBHOOK_PRE }}
      DISCORD_WEBHOOK_LIVE: ${{ secrets.DISCORD_WEBHOOK_LIVE }}
      DISCORD_WEBHOOK_LIVE_ALERTS: ${{ secrets.DISCORD_WEBHOOK_LIVE_ALERTS }}
      GOOGLE_SHEETS_WEBAPP_URL: ${{ secrets.GOOGLE_SHEETS_WEBAPP_URL }}
      GOOGLE_SHEETS_TOKEN: ${{ secrets.GOOGLE_SHEETS_TOKEN }}
      APP_TIMEZONE: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Show trigger
        shell: bash
        run: |
          echo "event=${{ github.event_name }}"
          echo "source=${{ inputs.source || 'github-schedule' }}"
          echo "date=${{ inputs.date || 'today' }}"
      - name: Run PRE
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.source }}" = "supabase" ]; then
              # Supabase é automático: nunca duplica um PRE SUCCESS do mesmo dia.
              ac10-next pre --if-missing
            elif [ -n "${{ inputs.date }}" ]; then
              # Manual com data explícita continua forçando a execução solicitada.
              ac10-next pre --date "${{ inputs.date }}"
            else
              # Manual sem data continua funcionando exatamente como antes.
              ac10-next pre
            fi
          else
            # Scheduler nativo do GitHub é apenas backup.
            ac10-next pre --if-missing
          fi
