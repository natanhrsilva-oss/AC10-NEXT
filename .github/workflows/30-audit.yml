name: "30 - AC10 AUDIT WEEKLY"

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Data final opcional YYYY-MM-DD da janela semanal"
        required: false
        type: string
  schedule:
    # Terça 23:00 em Brasília = quarta 02:00 UTC.
    - cron: "0 2 * * 3"

permissions:
  contents: read

concurrency:
  group: ac10-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_PRE: ${{ secrets.DISCORD_WEBHOOK_PRE }}
      DISCORD_WEBHOOK_LIVE: ${{ secrets.DISCORD_WEBHOOK_LIVE }}
      GOOGLE_SHEETS_WEBAPP_URL: ${{ secrets.GOOGLE_SHEETS_WEBAPP_URL }}
      GOOGLE_SHEETS_TOKEN: ${{ secrets.GOOGLE_SHEETS_TOKEN }}
      APP_TIMEZONE: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run weekly AUDIT
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            ac10-next audit --date "${{ inputs.date }}"
          else
            ac10-next audit
          fi
