name: "20 - AC10 LIVE"

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Forçar coleta manual mesmo fora da janela/frequência"
        required: false
        default: true
        type: boolean
  schedule:
    # Watchdog a cada 5 min. O código cria/recupera apenas os slots exatos XX:00/15/30/45.
    # Brasília 06:00-23:59 = UTC 09:00-02:59.
    - cron: "*/5 0-2,9-23 * * *"

permissions:
  contents: read

concurrency:
  group: ac10-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_PRE: ${{ secrets.DISCORD_WEBHOOK_PRE }}
      DISCORD_WEBHOOK_LIVE: ${{ secrets.DISCORD_WEBHOOK_LIVE }}
      GOOGLE_SHEETS_WEBAPP_URL: ${{ secrets.GOOGLE_SHEETS_WEBAPP_URL }}
      GOOGLE_SHEETS_TOKEN: ${{ secrets.GOOGLE_SHEETS_TOKEN }}
      APP_TIMEZONE: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run LIVE / watchdog
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              ac10-next live --force
            else
              ac10-next live
            fi
          else
            ac10-next live --scheduled
          fi
