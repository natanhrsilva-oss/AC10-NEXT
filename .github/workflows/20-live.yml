name: "20 - AC10 LIVE"
run-name: "LIVE | ${{ github.event_name }} | ${{ inputs.source || 'github-schedule' }}"

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Forçar coleta manual agora (reinicia o relógio de 15 min após SUCCESS)"
        required: false
        default: true
        type: boolean
      source:
        description: "Origem do disparo (manual/supabase)"
        required: false
        default: "manual"
        type: string
  schedule:
    # BACKUP: o relógio primário passa a ser o Supabase Cron no v0.4.9.
    # Mantemos o scheduler do GitHub como segunda camada de segurança.
    # O Python consulta o Supabase ANTES da API e só coleta se >=15 min
    # desde o último LIVE SUCCESS (inclusive manual).
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 6-23 * * *"
      timezone: "America/Sao_Paulo"

permissions:
  contents: read

concurrency:
  group: ac10-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_PRE: ${{ secrets.DISCORD_WEBHOOK_PRE }}
      DISCORD_WEBHOOK_LIVE: ${{ secrets.DISCORD_WEBHOOK_LIVE }}
      GOOGLE_SHEETS_WEBAPP_URL: ${{ secrets.GOOGLE_SHEETS_WEBAPP_URL }}
      GOOGLE_SHEETS_TOKEN: ${{ secrets.GOOGLE_SHEETS_TOKEN }}
      APP_TIMEZONE: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Show trigger
        shell: bash
        run: |
          echo "event=${{ github.event_name }}"
          echo "source=${{ inputs.source || 'github-schedule' }}"
          echo "force=${{ inputs.force || 'n/a' }}"
      - name: Run LIVE / rolling controller
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            # Botão manual do GitHub: coleta agora e reinicia o relógio após SUCCESS.
            ac10-next live --force
          else
            # Supabase (force=false) e schedule de backup: SEMPRE passam pelo
            # controlador de 15 minutos antes de chamar a Highlightly.
            ac10-next live --scheduled
          fi
